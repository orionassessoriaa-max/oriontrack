version: "3.8"

services:
  oriontrack:
    image: "${ORIONTRACK_IMAGE:-oriontrack:latest}"
    stop_grace_period: 30s
    networks:
      - Orionvps
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL obrigatoria}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY obrigatoria}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY obrigatoria}"
      ORION_N8N_WEBHOOK_SECRET: "${ORION_N8N_WEBHOOK_SECRET}"
      META_ACCESS_TOKEN: "${META_ACCESS_TOKEN}"
      META_BUSINESS_ID: "${META_BUSINESS_ID}"
      META_GRAPH_VERSION: "${META_GRAPH_VERSION:-v23.0}"
      EVOLUTION_API_URL: "${EVOLUTION_API_URL}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      EVOLUTION_WEBHOOK_URL: "${EVOLUTION_WEBHOOK_URL}"
      EVOLUTION_INSTANCE_PREFIX: "${EVOLUTION_INSTANCE_PREFIX:-orion}"
      UAZAPI_URL: "${UAZAPI_URL}"
      UAZAPI_GLOBAL_TOKEN: "${UAZAPI_GLOBAL_TOKEN}"
      UAZAPI_INSTANCE_PREFIX: "${UAZAPI_INSTANCE_PREFIX:-orion}"
      UAZAPI_WEBHOOK_URL: "${UAZAPI_WEBHOOK_URL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GOOGLE_DRIVE_ACCESS_TOKEN: "${GOOGLE_DRIVE_ACCESS_TOKEN}"
      GOOGLE_DRIVE_CLIENT_ID: "${GOOGLE_DRIVE_CLIENT_ID}"
      GOOGLE_DRIVE_CLIENT_SECRET: "${GOOGLE_DRIVE_CLIENT_SECRET}"
      GOOGLE_DRIVE_REFRESH_TOKEN: "${GOOGLE_DRIVE_REFRESH_TOKEN}"
      GOOGLE_DRIVE_FOLDER_ID: "${GOOGLE_DRIVE_FOLDER_ID}"
      META_DEFAULT_PAGE_ID: "${META_DEFAULT_PAGE_ID}"
      META_DEFAULT_LEAD_LINK: "${META_DEFAULT_LEAD_LINK}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      ORION_LEAD_AI_ELEVEN_VOICE_ID: "${ORION_LEAD_AI_ELEVEN_VOICE_ID}"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Orionvps"
        - "traefik.http.routers.oriontrack.rule=Host(`track.orionassessoriaa.com.br`)"
        - "traefik.http.routers.oriontrack.entrypoints=websecure"
        - "traefik.http.routers.oriontrack.tls=true"
        - "traefik.http.routers.oriontrack.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.oriontrack.loadbalancer.server.port=3000"
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        delay: 5s
        monitor: 30s

networks:
  Orionvps:
    external: true
