      {slug:'por-que-falham',num:'01',label:'O problema',title:'Onde o funil<br><em>está vazando.</em>',copy:'Teste real de atendimento, tempo até o primeiro contato e qualidade da abordagem. O diagnóstico mostra em que etapa o lead esfria.',content:`<div class="section-kicker">O problema</div><h2 class="section-title">Número por número,<br><em>sem maquiagem.</em></h2><div class="grid-3"><article class="card reveal"><span class="index">01</span><h3>Cliente Oculto</h3><p>Como seu lead é atendido hoje. Teste real de atendimento, sem aviso.</p></article><article class="card reveal"><span class="index">02</span><h3>Diagnóstico Comercial</h3><p>Taxa de conexão e de agendamento. Em que etapa o lead esfria. Gargalo isolado e nomeado.</p></article><article class="card reveal"><span class="index">03</span><h3>Performance</h3><p>CPL, CAC e ROAS do mês. Leads e vendas por origem. Próximas decisões de verba.</p></article></div><div class="total reveal"><span>ENTREGA DO MÊS<br><small class="copy">CAC conhecido e oferta validada com venda real, não com opinião.</small></span><strong>01 / 03</strong></div>`},
      {slug:'metodo',num:'02',label:'Método',title:'Metodologia em<br><em>três fases.</em>',copy:'Três fases encadeadas. Nenhuma começa antes da anterior entregar o que precisa entregar. É isso que separa escala previsível de sorte.',content:`<div class="section-kicker">Como trabalhamos</div><h2 class="section-title">Um sistema.<br><em>Três fases.</em></h2><div class="grid-3 method-grid"><article class="card reveal"><span class="index">01</span><h3>Setup Inicial</h3><p>Contas, funis, ofertas, trackeamento e CRM no ar. Saímos do achismo e passamos a medir.</p><details><summary>Ver entregas</summary><ul><li>Configuração de contas</li><li>Produção das ofertas</li><li>Configuração dos funis</li><li>Implementação do trackeamento</li><li>Automação CRM</li></ul></details></article><article class="card reveal"><span class="index">02</span><h3>Otimização</h3><p>Diagnóstico comercial, oferta validada e ajuste fino de campanha. O custo por venda cai.</p><details><summary>Ver entregas</summary><ul><li>Cliente Oculto</li><li>Diagnóstico Comercial</li><li>Oferta Validada</li><li>Vendas Consolidadas</li><li>Relatório de Performance</li></ul></details></article><article class="card reveal"><span class="index">03</span><h3>Escala Previsível</h3><p>Com o número fechado, aumentar verba vira decisão de matemática, não de coragem.</p><details><summary>Ver entregas</summary><ul><li>Realocação de verba</li><li>Correção dos gargalos</li><li>Meta de CAC definida</li><li>Expansão de canal e praça</li><li>Projeção de faturamento</li></ul></details></article></div>`},
      {slug:'criativos',num:'03',label:'Fundamento 1',title:'Produção das<br><em>ofertas.</em>',copy:'Criativos, copies e páginas construídos para levar o lead do anúncio até a primeira abordagem.',content:`<div class="section-kicker">O que entra aqui</div><h2 class="section-title">Criativo e imagem<br><em>com propósito.</em></h2><div class="grid-4"><article class="card reveal"><span class="index">01</span><h3>Criativos</h3><p>Criativos e variações de copy.</p></article><article class="card reveal"><span class="index">02</span><h3>Captura</h3><p>Página de captura do lead.</p></article><article class="card reveal"><span class="index">03</span><h3>Abordagem</h3><p>Roteiro da primeira abordagem.</p></article><article class="card reveal"><span class="index">04</span><h3>Qualificação</h3><p>Formulário com qualificação.</p></article></div><div style="height:80px"></div><div class="section-kicker">Formatos Orion</div><h2 class="section-title">Estrutura para<br><em>testar e otimizar.</em></h2><div class="media-grid"><article class="media-card reveal"><img src="/ferramentas/capa/socialmedia1.png" alt="Criativos"><div class="media-copy"><span>CRIATIVOS</span><h3>Copies conforme necessidade</h3></div></article><article class="media-card reveal"><img src="/ferramentas/capa/captação1.png" alt="Captação"><div class="media-copy"><span>CAPTAÇÃO</span><h3>Testes A/B e otimização</h3></div></article><article class="media-card reveal"><img src="/ferramentas/capa/ia1.png" alt="Inteligência artificial"><div class="media-copy"><span>ESCALA</span><h3>Escala de criativos</h3></div></article></div>`},
      {slug:'trafego',num:'04',label:'Fundamento 2',title:'Trackeamento<br><em>ponta a ponta.</em>',copy:'Eventos, UTMs e conversões conectam o anúncio ao CRM. Cada decisão de verba parte do que virou venda.',content:`<div class="section-kicker">Relatório de Performance</div><h2 class="section-title">Do anúncio<br><em>até a venda.</em></h2><div class="metric-band reveal"><div><small>Leitura mensal</small><strong>Performance</strong></div><div><small>Indicador</small><strong>CPL</strong></div><div><small>Indicador</small><strong>CAC</strong></div><div><small>Indicador</small><strong>ROAS</strong></div></div><div style="height:60px"></div><details class="reveal" open><summary>Qualificação no formulário</summary><p>Público frio, morno e remarketing. Formulário com qualificação. Caminho do lead até a call.</p></details><details class="reveal"><summary>Eventos e UTMs padronizados</summary><p>CAPI e Advanced Match. Conversões offline vindas do CRM.</p></details><details class="reveal"><summary>Realocação de verba</summary><p>Realocação de verba por canal e criativo. Meta de CAC definida e defendida.</p></details>`},
      {slug:'comercial',num:'05',label:'Fundamento 3',title:'Vendas com<br><em>processo repetível.</em>',copy:'Cliente oculto, diagnóstico comercial, script de qualificação e cadência de follow-up transformam atendimento em processo.',content:`<div class="section-kicker">Na prática</div><h2 class="section-title">Atendimento acompanhado<br><em>de verdade.</em></h2><div class="grid-3"><article class="card reveal"><span class="index">01</span><h3>Cliente Oculto</h3><p>Teste real de atendimento, sem aviso. Tempo até o primeiro contato.</p></article><article class="card reveal"><span class="index">02</span><h3>Diagnóstico</h3><p>Qualidade da abordagem no WhatsApp e gargalo isolado.</p></article><article class="card reveal"><span class="index">03</span><h3>Consolidação</h3><p>Script aplicado, cadência definida e padrão de fechamento repetível.</p></article></div><div style="height:80px"></div><div class="gallery"><figure class="reveal"><img src="/fotos/PATRICK%20ADMIN.png" alt="Equipe Orion"><figcaption>Gestão e estratégia</figcaption></figure><figure class="reveal"><img src="/fotos/MATHEUS%20GESTOR.png" alt="Equipe Orion"><figcaption>Gestão de tráfego</figcaption></figure><figure class="reveal"><img src="/fotos/GEOVANNA%20GESTORA.png" alt="Equipe Orion"><figcaption>Acompanhamento</figcaption></figure><figure class="reveal"><img src="/fotos/LUCAS%20ACOOUNT.png" alt="Equipe Orion"><figcaption>Conta e relacionamento</figcaption></figure><figure class="reveal"><img src="/fotos/NATALINE%20DESIGNER.png" alt="Equipe Orion"><figcaption>Criação</figcaption></figure><figure class="reveal"><img src="/fotos/EWERTTON%20DEVOPS.png" alt="Equipe Orion"><figcaption>Tecnologia e CRM</figcaption></figure></div>`},
      {slug:'resultados',num:'06',label:'Prova',title:'Resultado.<br><em>Não promessa.</em>',copy:'Cases presentes na proposta comercial Orion. Clique em cada card para abrir os dados completos.',content:`<div class="section-kicker">Resultados reais</div><h2 class="section-title">Cinco operações.<br><em>Dados registrados.</em></h2><div class="cases">${Object.entries(cases).map(([key,c],i)=>`<button class="case reveal" data-case="${key}"><img src="${c.image}" alt="${c.title}"><span class="case-copy"><span class="case-no">0${i+1} · VER CASO</span><h3>${c.title}</h3><span class="hero-metric">${c.main}</span><small>${c.label}</small></span></button>`).join('')}</div><div class="logo-strip reveal"><div class="logo-track">${['vida-protegida','lider','ligamar','opportunity','unity','pentagono','invida','priorize','vida-protegida','lider','ligamar','opportunity','unity','pentagono','invida','priorize'].map(x=>`<img src="assets/logo-${x}.webp" alt="">`).join('')}</div></div>`},
      {slug:'como-operamos',num:'07',label:'Operação',title:'Acompanhamento<br><em>conectado.</em>',copy:'As frentes da operação rodam ao mesmo tempo e conversam entre si, da configuração de contas ao relatório de performance.',content:`<div class="section-kicker">Operação Orion</div><h2 class="section-title">Tudo conectado<br><em>ao centro.</em></h2><div class="orbit reveal"><div class="orbit-center"><img src="/orion-empty-logo.png" alt="Orion"></div><article class="orbit-node n1"><h3>Configuração de contas</h3><p>Gerenciador, pixel e acessos.</p></article><article class="orbit-node n2"><h3>Produção das ofertas</h3><p>Criativos, copies e páginas.</p></article><article class="orbit-node n3"><h3>Configuração dos funis</h3><p>Caminho do lead até a call.</p></article><article class="orbit-node n4"><h3>Trackeamento</h3><p>Eventos, UTMs e conversões.</p></article><article class="orbit-node n5"><h3>Automação CRM</h3><p>Pipeline e follow-up automático.</p></article><article class="orbit-node n6"><h3>Performance</h3><p>Número por número, sem maquiagem.</p></article></div>`},
      {slug:'planos',num:'08',label:'Investimento',title:'Quanto custa<br>montar isso<br><em>por fora?</em>',copy:'Não é o salário de uma pessoa. É o time inteiro que precisa existir para a operação funcionar.',content:`<div class="section-kicker">Clique em cada valor para revelar</div><h2 class="section-title">Quatro contratações.<br><em>Um projeto.</em></h2><div class="cost-list"><button class="cost-row reveal"><span class="cost-no">01</span><h3>Gestor de Projetos</h3><p>Conduz o cronograma e cobra as entregas.</p><span class="cost-value">R$ 9.000 semestral</span></button><button class="cost-row reveal"><span class="cost-no">02</span><h3>Gestor de Tráfego</h3><p>Sobe, acompanha e otimiza as campanhas todo dia.</p><span class="cost-value">R$ 12.000 semestral</span></button><button class="cost-row reveal"><span class="cost-no">03</span><h3>Coordenador</h3><p>Lê o número, realoca verba e responde pelo resultado.</p><span class="cost-value">R$ 18.000 semestral</span></button><button class="cost-row reveal"><span class="cost-no">04</span><h3>Designer</h3><p>Produz criativo, página e material de venda.</p><span class="cost-value">R$ 9.000 semestral</span></button></div><div class="total reveal"><span>PROJETO TOTAL · 6 MESES<br><small class="copy">Quatro contratações e quatro processos seletivos.</small></span><strong>R$ 60.000</strong></div>`},
      {slug:'investimento',num:'09',label:'Valores',title:'O investimento que<br>cabe na sua<br><em>operação.</em>',copy:'Escolha o nível de operação adequado para a sua estrutura.',content:`<div class="section-kicker">Planos Orion</div><h2 class="section-title">Escolha o<br><em>nível de operação.</em></h2><div class="term-tabs"><button class="active">Mensal sem fidelidade</button><button>3 meses</button><button>6 meses</button></div><div class="plans"><article class="plan reveal"><span class="tag">ESSENCIAL</span><h3>Essencial</h3><div class="plan-price">R$ 1.900 <small>/ mês</small></div><ul><li>Meta Ads, estratégia e formulários</li><li>Criativos e copies conforme necessidade</li><li>Pixel, UTMs e eventos</li><li>Gestão via planilha</li><li>Suporte 1x por semana</li></ul></article><article class="plan featured reveal"><span class="tag">MAIS ESCOLHIDO</span><h3>Performance</h3><div class="plan-price">R$ 2.500 <small>/ mês</small></div><ul><li>Meta + Google Ads</li><li>Criativos, testes A/B e otimização</li><li>CAPI, conversões offline e lead tracking</li><li>CRM, pipeline e automações</li><li>Suporte 2x por semana</li></ul></article><article class="plan reveal"><span class="tag">ESCALA</span><h3>Scale</h3><div class="plan-price">R$ 3.500 <small>/ mês</small></div><ul><li>Estratégia multicanal de escala</li><li>Escala de criativos</li><li>Full funnel e inteligência de dados</li><li>Automações avançadas e agente de IA</li><li>Suporte 3x por semana</li></ul></article></div><p class="copy" style="margin-top:30px">Verba de mídia é investida diretamente na plataforma e não está incluída nos valores acima.</p>`},
      {slug:'comecar',num:'10',label:'Próximos passos',title:'Obrigado pela<br><em>confiança.</em>',copy:'A partir do aceite, a operação começa com contrato, onboarding, planejamento e configuração.',content:`<div class="section-kicker">A partir do aceite</div><h2 class="section-title">Do contrato às campanhas<br><em>em cerca de 10 dias úteis.</em></h2><div class="steps"><article class="step reveal"><span class="step-no">01</span><div><h3>Assinatura e onboarding</h3><p>Envio digital, assinatura no mesmo dia. Reunião de kick-off para alinhar meta, verba e responsáveis.</p></div></article><article class="step reveal"><span class="step-no">02</span><div><h3>Planejamento e configuração</h3><p>Ofertas, público e plano de mídia do mês 1. Acessos, pixel, CRM e trackeamento.</p></div></article><article class="step reveal"><span class="step-no">03</span><div><h3>Apresentação e campanhas</h3><p>Você aprova antes de qualquer real ser gasto. Os primeiros leads começam a chegar e ser medidos.</p></div></article></div><div class="closing reveal"><img src="/orion-empty-logo.png" alt="Orion"><h2>Vamos colocar<br><span style="color:var(--cyan)">no ar?</span></h2><p class="copy">@orionassessoria · Brasília, DF</p><button class="primary" onclick="window.print()">Baixar proposta em PDF</button></div>`}
    ];
    const view=document.getElementById('view'),status=document.getElementById('stageStatus'),menu=document.getElementById('menu'),menuGrid=document.getElementById('menuGrid');
    const esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function slug(){return location.hash.replace(/^#\/?/,'').split('/')[0]||''}
    function go(s){location.hash='#/'+s;scrollTo(0,0);closeMenu()}
    function nextLink(i){if(i>=pages.length-1)return'';const n=pages[i+1];return `<div class="next-stage"><span>ETAPA ${pages[i].num||'00'} · ${pages[i].label}</span><button data-go="${n.slug}">PRÓXIMA ETAPA ${n.num} · ${n.label} →</button></div>`}
    function cover(){return `<main class="page cover"><img class="chrome" src="assets/orion-chrome.jpg" alt=""><div class="cover-shell"><div class="cover-kicker">Proposta comercial</div><div class="brand-lockup"><img src="/orion-empty-logo.png" alt="Orion"><span class="multiply">×</span><label class="client-logo" for="logoInput" id="clientLogo">ADICIONAR LOGO</label><input id="logoInput" type="file" accept="image/*" hidden></div><div class="cover-line"></div><div class="cover-fields"><span contenteditable="true">Nome do lead</span><span contenteditable="true">Corretora de planos de saúde</span><span>Horizonte: 6 meses</span><span>Setembro de 2026</span></div><button class="primary" data-go="por-que-falham">Iniciar apresentação →</button></div></main>`}
    function render(){const s=slug();let i=pages.findIndex(p=>p.slug===s);if(i<0)i=0;const p=pages[i];status.innerHTML=p.cover?'':`<b>${p.num}</b> ${esc(p.label)}`;view.innerHTML=p.cover?cover():`<main class="page"><section class="hero"><div class="hero-inner"><div class="stage-lockup"><span class="stage-number">${p.num}</span><span class="stage-meta">ETAPA ${p.num}<strong>${esc(p.label)}</strong></span></div><h1>${p.title}</h1><div class="title-rule"></div><p class="hero-copy">${esc(p.copy)}</p></div></section><section class="content"><div class="content-inner">${p.content}${nextLink(i)}</div></section></main>`;bind();requestAnimationFrame(observe)}
    function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('.cost-row').forEach(x=>x.onclick=()=>x.classList.toggle('revealed'));document.querySelectorAll('.case').forEach(x=>x.onclick=()=>openCase(x.dataset.case));document.querySelectorAll('.term-tabs button').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));x.classList.add('active')});const input=document.getElementById('logoInput');if(input)input.onchange=e=>{const f=e.target.files[0];if(f)document.getElementById('clientLogo').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Logo do cliente">`}}
    function observe(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12});document.querySelectorAll('.reveal').forEach(x=>o.observe(x))}
    function openCase(k){const c=cases[k];document.getElementById('modalImage').src=c.image;document.getElementById('modalTitle').textContent=c.title;document.getElementById('modalMetrics').innerHTML=c.metrics.map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`).join('');document.getElementById('caseModal').classList.add('open')}
    function closeModal(){document.getElementById('caseModal').classList.remove('open')}
    function openMenu(){menu.classList.add('open');menu.setAttribute('aria-hidden','false')}
    function closeMenu(){menu.classList.remove('open');menu.setAttribute('aria-hidden','true')}
    menuGrid.innerHTML=pages.map((p,i)=>`<button class="menu-link" data-menu="${p.slug}"><b>${p.num||'00'}</b><span>${esc(p.label)}</span></button>`).join('');menuGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.menu));document.getElementById('menuButton').onclick=openMenu;document.getElementById('menuClose').onclick=closeMenu;menu.onclick=e=>{if(e.target===menu)closeMenu()};document.getElementById('modalClose').onclick=closeModal;document.getElementById('caseModal').onclick=e=>{if(e.target.id==='caseModal')closeModal()};addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeModal()}if(e.key==='ArrowRight'){const i=pages.findIndex(p=>p.slug===slug());if(i<pages.length-1)go(pages[i+1].slug)}if(e.key==='ArrowLeft'){const i=pages.findIndex(p=>p.slug===slug());if(i>0)go(pages[i-1].slug)}});addEventListener('hashchange',render);render();
  </script>
