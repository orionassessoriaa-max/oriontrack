<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost:3000" />
    <title>ORION TRACK - Redirecionando</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f172a;
            color: white;
            text-align: center;
        }
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a { color: #3b82f6; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Redirecionando para o Painel...</h1>
    <p>Certifique-se de que o comando <strong>npm run dev</strong> está rodando no terminal do VS Code.</p>
    <p>Se não for redirecionado automaticamente, <a href="http://localhost:3000">clique aqui</a>.</p>
    
    <script>
        // Tenta redirecionar imediatamente via JS
        window.location.href = "http://localhost:3000";
    </script>
</body>
</html>
